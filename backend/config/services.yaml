# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # Informations publiques du centre (US-01) — à adapter.
    centre:
        nom: 'Centre SmartKiné'
        adresse: 'Avenue Habib Bourguiba, 4000 Sousse, Tunisie'
        telephone: '+216 73 000 000'
        email: 'contact@smartkine.tn'
        horaires:
            - { jours: 'Lundi – Vendredi', heures: '08:00 – 19:00' }
            - { jours: 'Samedi', heures: '08:00 – 13:00' }
            - { jours: 'Dimanche', heures: 'Fermé' }
        services:
            - { titre: 'Rééducation orthopédique', description: 'Après fracture, entorse, prothèse ou opération.' }
            - { titre: 'Kinésithérapie du sport', description: 'Reprise sportive, tendinites, lésions musculaires.' }
            - { titre: 'Rééducation neurologique', description: 'AVC, sclérose en plaques, troubles de l''équilibre.' }
            - { titre: 'Kiné respiratoire', description: 'Bronchiolite, BPCO, suites de COVID.' }
            - { titre: 'Massothérapie & douleurs', description: 'Lombalgies, cervicalgies, douleurs chroniques.' }
        latitude: 35.8256
        longitude: 10.6084

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $mailerFrom: '%env(MAILER_FROM)%'
            string $frontendUrl: '%env(FRONTEND_URL)%'
            array $centre: '%centre%'

    App\:
        resource: '../src/'
