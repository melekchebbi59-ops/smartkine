<div class="login-container">
  <div class="login-card">
    <h1><a routerLink="/" class="text-decoration-none" style="color: inherit"><i class="bi bi-heart-pulse-fill"></i> SmartKiné</a></h1>
    <h2>Connexion</h2>
    <p>Patient, kinésithérapeute ou gérant : connectez-vous à votre espace</p>

    @if (expired) {
      <div class="alert alert-warning py-2 small">Votre session a expiré, reconnectez-vous.</div>
    }
    @if (error()) {
      <div class="alert alert-danger py-2 small">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()" #f="ngForm">
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="exemple@email.com"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Votre mot de passe"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" [disabled]="f.invalid || loading()">
        @if (loading()) { Connexion... } @else { Se connecter }
      </button>
    </form>

    <p class="register-link">
      Pas encore de compte ?
      <a routerLink="/inscription">Créer un compte</a>
    </p>
  </div>
</div>
